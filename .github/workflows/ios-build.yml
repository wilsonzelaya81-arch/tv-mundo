name: iOS build

on:
  push:
    branches: [feature/ios-native-app, main]
    paths: ["ios/**", "index.html", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:

jobs:
  build:
    name: Compilar TVMundo (iOS 16+, sin firma)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Verificar que la web embebida está al día
        run: |
          for f in index.html manifest.json sw.js icon-192.png icon-512.png; do
            cmp -s "$f" "ios/TVMundo/Web/$f" || echo "::warning file=ios/TVMundo/Web/$f::Difiere del sitio web. Ejecuta ios/sync-web.sh"
          done

      - name: Compilar para simulador (iPhone y iPad)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/TVMundo.xcodeproj \
            -scheme TVMundo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-sim.log | grep -E "error|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-sim.log

      - name: Compilar Release para dispositivo (sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/TVMundo.xcodeproj \
            -scheme TVMundo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build-device.log | grep -E "error|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-device.log

      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
